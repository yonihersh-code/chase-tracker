<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12392b">
<title>Chase tracker</title>
<style>
:root{--bg:#eef2ee;--ink:#14201a;--mute:#5b6a61;--card:#fff;--line:#dbe2dc;--a:#1f6b4a;--b:#c0392b;--hero:#12392b;--shadow:0 1px 2px rgba(20,32,26,.06),0 4px 14px rgba(20,32,26,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1511;--ink:#e6ece7;--mute:#93a399;--card:#17201a;--line:#2a372e;--a:#6fc79a;--b:#ff8a80;--hero:#0b2a1f;--shadow:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.top{background:var(--hero);color:#f3f7f2}
.top div{max-width:780px;margin:0 auto;padding:12px 16px 14px}
h1{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;margin:0;opacity:.65;font-weight:600}
#vs{font-size:1.1rem;font-weight:700;margin-top:2px}
main{max-width:780px;margin:0 auto;padding:14px 16px 48px;display:grid;gap:14px}
#t-charts,#t-teams,#t-players{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.card h2{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;font-weight:700}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.pick summary{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pick summary::after,.more summary::after{content:"\25BE";color:var(--mute)}
details[open]>summary::after{content:"\25B4"}
.more summary{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute)}
.sl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
#psum{flex:1;text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{display:grid;gap:10px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>*{min-width:0}
input,select,button{font:inherit;min-height:40px;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.pri{background:var(--a);color:#fff;border-color:var(--a);font-weight:600}
.f{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--mute)}
#id{flex:1 1 220px}#lim,#bat{width:68px}#saved{flex:1 1 180px}#msel,#rsel,#tsel{flex:1 1 140px}#msel{flex-basis:100%}
.note{font-size:.85rem;color:var(--mute);margin:0}
.status{margin:0;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.88rem;color:var(--mute)}.status:empty{display:none}
.hero{background:var(--hero);color:#f3f7f2;border-radius:16px;padding:18px;box-shadow:var(--shadow)}
#head{opacity:.75;font-size:.95rem}
.big{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:4px 0}
#sub{opacity:.75}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}.chips:empty{display:none}
.chip{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 12px}
.chip span{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.chip b{font-size:1.4rem}.hot{color:#ff9d92}.ok{color:#8fe0b0}
#rp{display:none;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
#rp button{background:rgba(255,255,255,.12);color:#fff;border-color:transparent;min-height:36px;min-width:72px}
#rp input[type=range]{flex:1;padding:0;min-height:0;border:0;background:none;accent-color:#8fe0b0}
#pl{font-size:.8rem;opacity:.7;min-width:62px;text-align:right}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font-weight:600;min-height:38px}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.lg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;margin-bottom:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
svg{width:100%;height:auto;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{min-height:34px;font-size:.88rem;border-radius:999px}
.seg button[aria-pressed=true]{background:var(--a);color:#fff;border-color:var(--a)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
td small{color:var(--mute)}
h3{font-size:.95rem;margin:16px 0 4px}
@media(max-width:480px){.card{padding:12px}.hero{padding:16px}}
</style>
</head>
<body>
<header class="top"><div><h1>Chase tracker</h1><div id="vs">Pick a match or try a demo</div></div></header>
<main>
<details class="card pick" id="pick" open>
  <summary><span class="sl">Match</span><span id="psum">Choose a match</span></summary>
  <div class="pbody">
    <div class="row"><input id="id" placeholder="Paste a match or grade link" aria-label="Match or grade link"><button id="lbtn" class="pri" type="button">Load</button></div>
    <div class="row"><select id="saved" aria-label="Saved grades"></select></div>
    <div class="row" id="gf" hidden><select id="rsel" aria-label="Round"></select><select id="tsel" aria-label="Team"></select></div>
    <div class="row" id="gm" hidden><select id="msel" aria-label="Match"></select></div>
    <p class="note" id="gmsg" aria-live="polite"></p>
    <div class="row"><label class="f">Overs <input id="lim" type="number" min="0" value="24" placeholder="none" title="Leave blank for no limit"></label><label class="f">Batters <input id="bat" type="number" min="2" max="11" value="11"></label></div>
    <details class="more"><summary>Demos and export</summary>
      <div class="row" style="margin-top:10px"><select id="mode" aria-label="Source">
        <option value="fixtures/chase-fell-short.json">Demo: chase fell short</option>
        <option value="fixtures/final-over-wide.json">Demo: wide in final over</option>
        <option value="live">Live data</option></select>
        <button id="dl" type="button">Download JSON</button></div>
    </details>
    <input id="gid" hidden aria-hidden="true"><button id="gbtn" type="button" hidden>Load grade</button>
  </div>
</details>
<p class="status" id="msg" aria-live="polite"></p>
<section class="hero" aria-live="polite"><div id="head"></div><div id="big" class="big"></div><div id="sub"></div><div class="chips" id="grid"></div>
  <div id="rp"><button id="play" type="button">Play</button><input id="pos" type="range" min="0" value="0" aria-label="Replay position"><span id="pl"></span></div></section>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="t-charts">Charts</button><button role="tab" aria-selected="false" data-t="t-teams">Teams</button><button role="tab" aria-selected="false" data-t="t-players">Players</button></div>
<section id="t-charts">
  <div class="card"><h2>Run progression</h2><div class="lg"></div><svg id="worm" viewBox="0 0 700 260" role="img" aria-label="Runs by ball, both innings"></svg></div>
  <div class="card"><h2>Runs per over</h2><div class="lg"></div><svg id="mh" viewBox="0 0 700 164" role="img" aria-label="Runs per over, both innings"></svg></div>
</section>
<section id="t-teams" hidden><div class="card"><h2>Team comparison</h2><div class="sc" id="cmp"></div><p class="note" style="margin-top:8px">Each column is that team's batting. Extras are what the bowling side gave away.</p></div></section>
<section id="t-players" hidden><div class="card"><h2>Players</h2><div class="seg" id="seg"></div><div class="sc" id="bat-t"></div><h3 id="bw-h"></h3><div class="sc" id="bwl-t"></div></div></section>
</main>
<script>
const API='https://grassrootsapiproxy.cricket.com.au/scores/matches/';
const $=id=>document.getElementById(id);
let full=null,timer=null,poll=null,sel=0,cur=null;
async function getJSON(u){
  const r=await fetch(u),t=await r.text(),b=t.trim();
  if(!r.ok||!b)throw new Error(`HTTP ${r.status}, ${b?'body: '+b.slice(0,150):'empty body (no data for this ID, or the feed refused the request)'}`);
  try{return JSON.parse(b)}catch(e){throw new Error(`not JSON (HTTP ${r.status}): `+b.slice(0,150))}
}
const uuid=t=>(String(t).match(/[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}/i)||[''])[0].toLowerCase();
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ovs=n=>Math.floor(n/6)+'.'+n%6;
const tot=b=>b.runsBat+b.wides+b.noBalls+b.legByes+b.byes+b.penaltyRuns;
// Balls count towards the over unless they are a wide or no-ball in the FINAL over (rebowled there).
// RULE: confirm against more final-over samples. Only this function encodes it.
const counts=(b,lim)=>!(b.overNumber===lim-1&&(b.wides||b.noBalls));
function series(balls,lim){let ov=-1,c=0;return balls.map(b=>{if(b.overNumber!==ov){ov=b.overNumber;c=0}if(counts(b,lim))c++;return{n:ov*6+Math.min(6,c),r:b.progressRuns,w:b.progressWickets}})}

function teamStats(balls,lim,span){
  const ph=Math.ceil(span/4),o={n:0,dots:0,f:0,s:0,wd:0,nb:0,bye:0,best:0,pr:[0,0,0,0],pw:[0,0,0,0]};let st=0,pw=0;
  for(const b of balls){
    const c=counts(b,lim),t=tot(b),p=Math.min(3,Math.floor(b.overNumber/ph));
    if(c&&t===0){o.dots++;st++;o.best=Math.max(o.best,st)}else if(t>0)st=0;
    if(b.runsBat===4)o.f++;if(b.runsBat===6)o.s++;
    if(b.wides)o.wd++;if(b.noBalls)o.nb++;o.bye+=b.byes+b.legByes;
    o.pr[p]+=t;o.pw[p]+=b.progressWickets-pw;pw=b.progressWickets;
  }
  const sr=series(balls,lim);o.n=sr.length?sr[sr.length-1].n:0;const l=balls[balls.length-1];o.runs=l?l.progressRuns:0;o.wk=l?l.progressWickets:0;o.ph=ph;return o;
}
function players(balls,lim){
  const B=new Map(),W=new Map();
  const bt=(id,nm)=>{if(!id)return null;if(!B.has(id))B.set(id,{nm,r:0,b:0,d:0,f:0,s:0,out:''});return B.get(id)};
  for(const x of balls){
    const s=bt(x.strikerParticipantId,x.strikerShortName);bt(x.nonStrikerParticipantId,x.nonStrikerShortName);
    if(s){s.r+=x.runsBat;if(!x.wides){s.b++;if(x.runsBat===0)s.d++}if(x.runsBat===4)s.f++;if(x.runsBat===6)s.s++}
    if(x.dismissedParticipantId){const d=bt(x.dismissedParticipantId,'Batter');if(d)d.out=x.dismissalType||'out'}
    const id=x.bowlerParticipantId;if(!id)continue;
    if(!W.has(id))W.set(id,{nm:x.bowlerShortName,n:0,o:{},r:0,w:0,d:0,wd:0,nb:0});
    const w=W.get(id),c=counts(x,lim),ch=x.runsBat+x.wides+x.noBalls;
    if(c)w.o[x.overNumber]=(w.o[x.overNumber]||0)+1;w.r+=ch;if(c&&ch===0)w.d++;if(x.wides)w.wd++;if(x.noBalls)w.nb++;
    if(x.dismissalType&&x.dismissalType!=='Run Out')w.w++;
  }
  W.forEach(w=>w.n=Object.values(w.o).reduce((a,v)=>a+Math.min(6,v),0));
  return{bat:[...B.values()],bowl:[...W.values()]};
}
const pc=(a,b)=>b?Math.round(100*a/b)+'%':'-';
const tbl=(h,rows)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

function render(inns){
  cur=inns;
  const limIn=+$('lim').value||0,lim=limIn||Infinity,out=(+$('bat').value||11)-1;
  const I=[...inns].sort((a,b)=>a.inningsOrder-b.inningsOrder).filter(i=>i.balls.length);
  const T=full?.teams||[],nm=id=>T.find(t=>t.id===id)?.displayName,oth=id=>T.find(t=>t.id!==id)?.displayName;
  const S=I.map(i=>series(i.balls,lim)),L=a=>a[a.length-1],first=I[0]?.battingTeamId;
  const n1=nm(first)||'First innings',n2=I[1]?nm(I[1].battingTeamId)||'Chase':(oth(first)||'Chase');
  const span=limIn||Math.max(6,Math.ceil(Math.max(0,...S.map(x=>L(x).n))/6));
  const label=I.map((i,k)=>(nm(i.battingTeamId)||'Innings '+(k+1))+(I.length>2?(I.slice(0,k).some(j=>j.battingTeamId===i.battingTeamId)?' (2nd inns)':' (1st inns)'):''));
  $('vs').textContent=T.length?`${n1} v ${n2}`:'Pick a match or try a demo';$('psum').textContent=T.length?`${n1} v ${n2}`:'Choose a match';
  let head='',big='',sub='',cells=[];
  const cell=(k,v,c='')=>cells.push(`<div class="chip"><span>${k}</span><b class="${c}">${v}</b></div>`);
  $('msg').textContent='';
  if(!I.length){head='Waiting for first ball'}
  else if(I.length===1){
    const x=L(S[0]),crr=x.n?x.r*6/x.n:0;
    head=`${n1} batting first`;big=`${x.r}/${x.w}`;sub=`${ovs(x.n)} overs${limIn?' of '+limIn:''}`;
    cell('Run rate',crr.toFixed(2));if(limIn){cell('Projected',Math.round(crr*limIn));cell('Balls left',limIn*6-x.n)}
  }else if(I.length===2&&I[1].battingTeamId!==first){
    const t=L(S[0]).r+1,x=L(S[1]),need=t-x.r,left=limIn?limIn*6-x.n:Infinity;
    const crr=x.n?x.r*6/x.n:0,rrr=left>0&&left<Infinity?need*6/left:Infinity;
    head=`${n2} chasing ${t} (${n1} ${L(S[0]).r}/${L(S[0]).w})`;sub=`${x.r}/${x.w} after ${ovs(x.n)} overs`;
    if(need<=0)big='Target reached';
    else if(left<=0||x.w>=out)big=`Fell short by ${need-1}`;
    else if(!limIn){big=`${need} to win`;cell('Current rate',crr.toFixed(2));cell('Runs per wicket in hand',(need/Math.max(1,out-x.w)).toFixed(1));cell('Wickets in hand',out-x.w)}
    else{big=`${need} off ${left}`;
      cell('Required rate',rrr.toFixed(2),rrr>crr?'hot':'ok');cell('Current rate',crr.toFixed(2));
      cell('Runs per wicket in hand',(need/Math.max(1,out-x.w)).toFixed(1));cell('Rate gap',(rrr-crr>0?'+':'')+(rrr-crr).toFixed(2),rrr>crr?'hot':'ok');
      cell('Projected',Math.round(crr*limIn))}
    if(limIn&&I[1].balls.some(b=>b.overNumber===limIn-1))$('msg').textContent='Final over: wides and no-balls are not counted as balls.';
  }else{
    const tot={};I.forEach((i,k)=>{tot[i.battingTeamId]=(tot[i.battingTeamId]||0)+L(S[k]).r});
    const k=I.length-1,x=L(S[k]),id=I[k].battingTeamId,mine=tot[id],theirs=Object.keys(tot).filter(t=>t!==id).reduce((a,t)=>a+tot[t],0),crr=x.n?x.r*6/x.n:0;
    head=`Innings ${I.length}: ${nm(id)||''}`;big=`${x.r}/${x.w}`;sub=`${ovs(x.n)} overs. ${I.map((i,j)=>`${nm(i.battingTeamId)||'Team'} ${L(S[j]).r}/${L(S[j]).w}`).join(', ')}`;
    cell('Run rate',crr.toFixed(2));cell(mine>=theirs?'Lead':'Trail',Math.abs(mine-theirs),mine>=theirs?'ok':'hot');cell('Wickets in hand',out-x.w);
    $('msg').textContent='Charts show the first two innings. Tables show every innings.';
  }
  $('head').textContent=head;$('big').textContent=big;$('sub').textContent=sub;$('grid').innerHTML=cells.join('');
  document.querySelectorAll('.lg').forEach(e=>e.innerHTML=`<span><i style="background:var(--a)"></i>${esc(n1)}</span>`+(S[1]||T.length?`<span><i style="background:var(--b)"></i>${esc(n2)}</span>`:''));
  worm(S[0]||[],S[1]||[],span);mh(I[0]?.balls||[],I[1]?.balls||[],span);stats(I,label,span,lim,oth);
}
function worm(s1,s2,lim){
  const W=700,H=260,p=34,mx=Math.max(10,...[...s1,...s2].map(d=>d.r))*1.08,X=n=>p+(W-p-10)*n/(lim*6),Y=r=>H-24-(H-44)*r/mx;
  const path=(s,c)=>s.length?`<polyline fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" points="${X(0)},${Y(0)} ${s.map(d=>X(d.n).toFixed(1)+','+Y(d.r).toFixed(1)).join(' ')}"/>`:'';
  const wk=(s,c)=>s.filter((d,i)=>i&&d.w>s[i-1].w).map(d=>`<circle cx="${X(d.n)}" cy="${Y(d.r)}" r="4.5" fill="var(--card)" stroke="${c}" stroke-width="2"/>`).join('');
  let g='';for(let k=0;k<=4;k++){const r=Math.round(mx*k/4);g+=`<line x1="${p}" x2="${W-10}" y1="${Y(r)}" y2="${Y(r)}" stroke="var(--line)"/><text x="4" y="${Y(r)+4}" font-size="11" fill="var(--mute)">${r}</text>`}
  const st=lim>30?10:lim>16?4:2;
  for(let o=0;o<=lim;o+=st)g+=`<line x1="${X(o*6)}" x2="${X(o*6)}" y1="${Y(0)}" y2="${Y(mx)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${X(o*6)}" y="${H-6}" font-size="11" fill="var(--mute)" text-anchor="middle">${o}</text>`;
  g+=`<text x="${W-10}" y="${H-18}" font-size="11" fill="var(--mute)" text-anchor="end">overs</text>`;
  $('worm').innerHTML=g+path(s1,'var(--a)')+path(s2,'var(--b)')+wk(s1,'var(--a)')+wk(s2,'var(--b)');
}
function mh(b1,b2,lim){
  const W=700,bw=(W-40)/lim,half=(bw-3)/2,st=lim>30?5:lim>16?2:1,lab=lim<=30;
  const tally=balls=>{const per={};balls.forEach(b=>per[b.overNumber]=(per[b.overNumber]||0)+tot(b));return per};
  const p1=tally(b1),p2=tally(b2),m=Math.max(6,...Object.values(p1),...Object.values(p2));
  const bars=(per,off,c)=>Object.keys(per).map(k=>{const h=118*per[k]/m,x=20+k*bw+off;return`<rect x="${x}" y="${140-h}" width="${half}" height="${h}" rx="2" fill="${c}"/>${lab?`<text x="${x+half/2}" y="${136-h}" font-size="9" text-anchor="middle" fill="var(--mute)">${per[k]}</text>`:''}`}).join('');
  let ax='';for(let k=0;k<lim;k+=st)ax+=`<text x="${20+k*bw+bw/2-1.5}" y="157" font-size="10" text-anchor="middle" fill="var(--mute)">${k+1}</text>`;
  $('mh').innerHTML=ax+bars(p1,0,'var(--a)')+bars(p2,half,'var(--b)');
}
function stats(I,label,span,lim,oth){
  if(!I.length){$('cmp').innerHTML='<p class="note">No balls yet.</p>';$('seg').innerHTML='';$('bat-t').innerHTML=$('bwl-t').innerHTML='';$('bw-h').textContent='';return}
  const S=I.map(i=>teamStats(i.balls,lim,span)),r=[];
  const add=(k,f)=>r.push([k,...S.map(f)]);
  add('Score',s=>`${s.runs}/${s.wk}`);add('Overs',s=>ovs(s.n));
  add('Run rate',s=>s.n?(s.runs*6/s.n).toFixed(2):'-');
  add('Dot balls',s=>`${pc(s.dots,s.n)} <small>(${s.dots})</small>`);
  add('Longest dot run',s=>s.best+' balls');
  add('Fours / sixes',s=>`${s.f} / ${s.s}`);
  add('Runs in boundaries',s=>pc(4*s.f+6*s.s,s.runs));
  add('Wides / no-balls',s=>`${s.wd} / ${s.nb}`);add('Byes and leg byes',s=>s.bye);
  for(let p=0;p<4;p++){const a=p*S[0].ph+1,b=Math.min(span,(p+1)*S[0].ph);if(a>span)break;add(`Overs ${a}-${b}`,s=>`${s.pr[p]} <small>(${s.pw[p]} wkt)</small>`)}
  $('cmp').innerHTML=tbl(['',...label.map(esc)],r);
  if(!sel||!I.some(i=>i.inningsOrder===sel))sel=I[I.length-1].inningsOrder;
  $('seg').innerHTML=I.map((i,k)=>`<button aria-pressed="${i.inningsOrder===sel}" data-i="${i.inningsOrder}">${esc(label[k])} batting</button>`).join('');
  document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;render(cur)});
  const ci=I.find(i=>i.inningsOrder===sel),P=players(ci.balls,lim);
  $('bat-t').innerHTML=tbl(['Batter','R','B','4s','6s','SR','Dot %'],P.bat.map(x=>[esc(x.nm)+(x.out?` <small>${esc(x.out)}</small>`:' <small>not out</small>'),x.r,x.b,x.f,x.s,x.b?(100*x.r/x.b).toFixed(0):'-',pc(x.d,x.b)]));
  $('bw-h').textContent=`Bowling: ${oth(ci.battingTeamId)||'opposition'}`;
  $('bwl-t').innerHTML=tbl(['Bowler','O','R','W','Econ','Dot %','Wd','Nb'],P.bowl.map(x=>[esc(x.nm),ovs(x.n),x.r,x.w,x.n?(x.r*6/x.n).toFixed(1):'-',pc(x.d,x.n),x.wd,x.nb]));
}

// Grade browser: lists every match in a grade, from the same feed the site uses.
const G='https://grassrootsapiproxy.cricket.com.au/scores/grades/',Q='?jsconfig=eccn%3Atrue';
let GM=[],GR=[],GCUR='';
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function savedSel(){const g=ls.get('grades',[]);$('saved').innerHTML='<option value="">Saved grades</option>'+g.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
async function loadGrade(raw){
  const id=uuid(raw);if(!id){$('gmsg').textContent='No grade ID found in that. Paste the link from a Play Cricket grade page (it contains /grade/ then a long ID).';return}
  $('gmsg').textContent='Loading grade...';
  try{
    const [m,r]=await Promise.all([G+id+'/matches'+Q,G+id+'/rounds'+Q].map(getJSON));
    GM=m.matches||[];GR=r.rounds||[];GCUR=r.grade?.currentRoundId||'';
    ls.set('grades',[{id,name:r.grade?.name||id},...ls.get('grades',[]).filter(x=>x.id!==id)].slice(0,8));savedSel();$('saved').value=id;$('gid').value=id;
    const team=ls.get('team','');
    const teams=[...new Set(GM.flatMap(x=>x.teams.map(t=>t.displayName)))].sort();
    $('tsel').innerHTML='<option value="">All teams</option>'+teams.map(t=>`<option${t===team?' selected':''}>${esc(t)}</option>`).join('');
    $('rsel').innerHTML='<option value="">All rounds</option>'+GR.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
    $('rsel').value=teams.includes(team)?'':GCUR;
    $('gf').hidden=false;$('gm').hidden=false;$('gmsg').textContent=GM.length+' matches loaded. Choose a round, team and match below.';listMatches();
  }catch(e){$('gmsg').textContent='Could not load grade: '+e.message+(e instanceof TypeError?' (the request was blocked or the connection failed)':'')}
}
function listMatches(){
  const r=$('rsel').value,t=$('tsel').value;
  const fmt=d=>d?new Date(d).toLocaleString('en-AU',{weekday:'short',day:'numeric',month:'short',timeZone:'Australia/Melbourne'}):'';
  const rows=GM.filter(m=>(!r||m.round.id===r)&&(!t||m.teams.some(x=>x.displayName===t)))
    .sort((a,b)=>(a.matchSchedule[0]?.startDateTime||'').localeCompare(b.matchSchedule[0]?.startDateTime||''));
  const opts=rows.map(m=>{
    const one=m.matchType==='One Day',skip=['UPCOMING','ABANDONED'].includes(m.status),
      done=m.status==='COMPLETED',ov=done&&one?Math.ceil(Math.max(...m.teams.map(x=>+x.oversBowled||0))):0,
      sc=m.teams.map(x=>x.scoreText||'-').join(' v ');
    const line=done?m.resultText||'':m.status==='ABANDONED'?'Abandoned':m.status==='UPCOMING'?'Upcoming':`${m.status} ${sc}`;
    return`<option value="${m.id}" data-ov="${ov||''}"${one?'':' data-md="1"'}${skip?' disabled':''}>${esc(m.round.shortName)} ${fmt(m.matchSchedule[0]?.startDateTime)}: ${esc(m.teams.map(x=>x.displayName).join(' v '))} | ${esc(line)}</option>`}).join('');
  $('msel').innerHTML=`<option value="">${rows.length?`Choose a match (${rows.length})`:'No matches for that filter'}</option>`+opts;
}
$('gbtn').onclick=()=>gridGo();
$('gid').onchange=()=>gridGo();
$('saved').onchange=e=>e.target.value&&loadGrade(e.target.value);
$('rsel').onchange=listMatches;
$('tsel').onchange=()=>{ls.set('team',$('tsel').value);listMatches()};
$('msel').onchange=async e=>{
  const o=e.target.selectedOptions[0];if(!o||!o.value)return;
  $('mode').value='live';$('id').value=o.value;if(o.dataset.ov)$('lim').value=o.dataset.ov;if(o.dataset.md)$('lim').value='';
  scrollTo({top:0,behavior:'smooth'});await load();
  if(o.dataset.ov)$('msg').textContent+=` Overs set to ${o.dataset.ov} from the result. Change it if the game differed.`;
  if(o.dataset.md)$('msg').textContent+=' Overs limit cleared for this multi-day game. Enter one if it had a limit.';
};

// Replay: reveal the combined ball sequence a ball at a time.
function slice(p){let k=p;return[...full.innings].sort((x,y)=>x.inningsOrder-y.inningsOrder).map(i=>{const n=Math.min(k,i.balls.length);k-=n;return{inningsOrder:i.inningsOrder,battingTeamId:i.battingTeamId,balls:i.balls.slice(0,n)}})}
function stop(){clearInterval(timer);timer=null;$('play').textContent='Play'}
async function load(){
  if($('mode').value!=='live')$('id').dataset.last='';
  stop();clearInterval(poll);const m=$('mode').value;$('msg').textContent='';sel=0;
  try{
    if(m==='live'){
      $('rp').style.display='flex';$('pos').max=0;$('pos').value=0;$('pl').textContent='';
      const go=async()=>{const id=uuid($('id').value);if(!id){$('msg').textContent='Paste the match link or the ID from the Play Cricket URL.';return}
        try{const j=await getJSON(API+id+'/balls?jsconfig=eccn%3Atrue');
          if(!j||!Array.isArray(j.innings))throw new Error('feed has no innings list (it returned: '+(j&&typeof j==='object'?Object.keys(j).join(', ')||'an empty object':String(j))+')');
          j.innings.forEach(i=>i.balls=i.balls||[]);const was=+$('pos').max,atEnd=+$('pos').value>=was;full=j;
          const n=j.innings.reduce((t,i)=>t+i.balls.length,0);$('pos').max=n;setPos(atEnd?n:Math.min(+$('pos').value,n));if(atEnd&&was===0)$('pick').open=false;$('msg').textContent='Updated '+new Date().toLocaleTimeString('en-AU')}
        catch(e){$('msg').textContent='Feed error: '+e.message+'. Showing last good data.'}};
      await go();poll=setInterval(go,60000);
    }else{
      full=await (await fetch(m)).json();
      const tot=full.innings.reduce((s,i)=>s+i.balls.length,0);
      $('rp').style.display='flex';$('pos').max=tot;setPos(tot);
    }
  }catch(e){$('msg').textContent='Could not load: '+e.message}
}
function setPos(p){$('pos').value=p;$('pl').textContent=p+' balls';render(slice(+p))}
// One-box linking: paste any Play Cricket match or grade link into either box, it works out which it is.
function takeLink(raw,fromBox){
  const id=uuid(raw);
  if(!raw.trim())return;
  if(!id){(fromBox?$('msg'):$('gmsg')).textContent='No ID found in that. Paste the full link from the Play Cricket page.';return}
  if(/\/grade\//i.test(raw)){$('gid').value=id;$('id').value=$('id').dataset.last||'';return loadGrade(id)}
  $('id').value=id;if($('id').dataset.last===id&&$('mode').value==='live')return;
  $('id').dataset.last=id;$('id').value=id;$('mode').value='live';load();
}
const gridGo=()=>{const v=$('gid').value;/\/match\//i.test(v)?takeLink(v,0):loadGrade(v)};
$('lbtn').onclick=()=>{$('id').dataset.last='';takeLink($('id').value,1)};
$('mode').onchange=load;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>{const on=x===b;x.setAttribute('aria-selected',on);$(x.dataset.t).hidden=!on});ls.set('tab',b.dataset.t)});
{const t=ls.get('tab','t-charts'),b=document.querySelector(`.tabs button[data-t="${t}"]`);if(b)b.click()}
$('id').onchange=()=>takeLink($('id').value,1);
$('id').addEventListener('paste',()=>setTimeout(()=>takeLink($('id').value,1),0));
$('gid').addEventListener('paste',()=>setTimeout(gridGo,0));
$('lim').onchange=$('bat').onchange=()=>full&&setPos($('pos').value);
$('dl').onclick=()=>{if(!full){$('msg').textContent='Nothing loaded yet.';return}
  const id=$('mode').value==='live'?($('id').value.trim()||'live'):'replay',a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(full)],{type:'application/json'}));a.download=`balls-${id}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('msg').textContent='Saved balls-'+id+'.json';};
$('pos').oninput=e=>{stop();setPos(e.target.value)};
$('play').onclick=()=>{if(timer)return stop();$('play').textContent='Pause';if(+$('pos').value>=+$('pos').max)setPos(0);
  timer=setInterval(()=>{const p=+$('pos').value+1;if(p>+$('pos').max)return stop();setPos(p)},120)};
load();savedSel();{const g=ls.get('grades',[])[0];if(g)loadGrade(g.id)}
</script>
